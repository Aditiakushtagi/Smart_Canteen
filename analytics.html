<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Analytics - SmartCanteen</title></head><body data-page="analytics"><div class="app"><aside id="side"></aside><main>
